name: Build, Push, and Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-deploy:
    name: Build Docker Image, Push to Docker Hub & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Name
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Deploying version tag: ${TAG_NAME}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/outageiq
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Deployment on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "=========================================================="
          echo " Initiating Deployment on Render for Tag: ${IMAGE_TAG}"
          echo " Image: docker.io/${DOCKERHUB_USERNAME}/outageiq:${IMAGE_TAG}"
          echo "=========================================================="

          DEPLOY_SUCCESS=0

          # Option 1: Render REST API v1 (explicit imageUrl targeting v* tag)
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "🚀 Triggering Render deploy using Render REST API for image: docker.io/${DOCKERHUB_USERNAME}/outageiq:${IMAGE_TAG}..."
            HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"imageUrl\": \"docker.io/${DOCKERHUB_USERNAME}/outageiq:${IMAGE_TAG}\"}")
            
            HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✓ Render API deployment triggered successfully (HTTP ${HTTP_STATUS})!"
              echo "Response: ${HTTP_BODY}"
              DEPLOY_SUCCESS=1
            else
              echo "⚠️ Render API returned status ${HTTP_STATUS}: ${HTTP_BODY}"
            fi
          fi

          # Option 2: Render Deploy Hook URL (with imageUrl parameter and fallback)
          if [ "$DEPLOY_SUCCESS" -eq 0 ] && [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering Render deploy using Deploy Hook URL..."
            
            # Format hook URL with specific Docker image tag parameter
            TARGET_IMG="docker.io%2F${DOCKERHUB_USERNAME}%2Foutageiq%3A${IMAGE_TAG}"
            if echo "$RENDER_DEPLOY_HOOK_URL" | grep -q '?'; then
              HOOK_WITH_IMG="${RENDER_DEPLOY_HOOK_URL}&imgURL=${TARGET_IMG}"
            else
              HOOK_WITH_IMG="${RENDER_DEPLOY_HOOK_URL}?imgURL=${TARGET_IMG}"
            fi

            HOOK_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$HOOK_WITH_IMG" || curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
            HOOK_STATUS=$(echo "$HOOK_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

            if [ "$HOOK_STATUS" -ge 200 ] && [ "$HOOK_STATUS" -lt 300 ]; then
              echo "✓ Render Deploy Hook triggered successfully (HTTP ${HOOK_STATUS})!"
              DEPLOY_SUCCESS=1
            else
              echo "⚠️ Render Deploy Hook returned status ${HOOK_STATUS}"
            fi
          fi

          # Validation
          if [ "$DEPLOY_SUCCESS" -eq 1 ]; then
            echo "🎉 Successfully deployed tag ${IMAGE_TAG} to Render!"
          else
            echo "❌ Deployment trigger failed. Please ensure either 'RENDER_DEPLOY_HOOK_URL' or ('RENDER_API_KEY' and 'RENDER_SERVICE_ID') are configured in GitHub repository secrets."
            exit 1
          fi
